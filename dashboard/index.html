          <div class="am-row"><span class="am-lbl" id="mnThemeLbl">Theme</span>
            <div class="mn-seg" role="group" aria-labelledby="mnThemeLbl">
              <button type="button" role="menuitemradio" aria-checked="false" data-theme-mode="system" title="Follow the operating system"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1.6"/><path d="M6 13.5h4"/></svg>System</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-theme-mode="dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z"/></svg>Dark</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-theme-mode="light"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>Light</button>
            </div>
          </div>
          <div class="am-row"><span class="am-lbl" id="mnAccLbl">Accent</span>
            <div class="mn-swatches" role="group" aria-labelledby="mnAccLbl">
              <button type="button" role="menuitemradio" aria-checked="true" data-keep data-accent="iris" title="Iris" aria-label="Iris"><i></i></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-keep data-accent="jade" title="Jade" aria-label="Jade"><i></i></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-keep data-accent="amber" title="Amber" aria-label="Amber"><i></i></button>
              <button type="button" role="menuitemradio" aria-checked="false" data-keep data-accent="rose" title="Rose" aria-label="Rose"><i></i></button>
            </div>
          </div>
          <!-- density: comfortable or compact cards, rail and tables (js/features/density.js) -->
          <div class="am-row"><span class="am-lbl" id="mnDensLbl">Density</span>
            <div class="mn-seg mn-seg-2" role="group" aria-labelledby="mnDensLbl">
              <button type="button" role="menuitemradio" aria-checked="true" data-density="comfortable" title="Roomy cards, rail and tables"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="4" rx="1"/><rect x="2.5" y="9.5" width="11" height="4" rx="1"/></svg>Roomy</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-density="compact" title="Tighter cards, rail and tables: more homes on screen"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 3.5h11M2.5 6.5h11M2.5 9.5h11M2.5 12.5h11"/></svg>Compact</button>
            </div>
          </div>
          <!-- [office pin] style of the destination marker -->
          <div class="am-row"><span class="am-lbl" id="mnPinLbl">Office pin</span>
            <div class="mn-seg mn-seg-2" role="group" aria-labelledby="mnPinLbl">
              <button type="button" role="menuitemradio" aria-checked="true" data-dest-pin="gold" data-keep title="White pin with a gold outline">Gold</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-dest-pin="classic" data-keep title="The green pin with a white briefcase">Green</button>
            </div>
          </div>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-keep class="mn-row" id="mnGolden"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><span class="t">Golden-hour map tint<small id="mnGoldenSub">Warms the map as the sun gets low</small></span><i class="mn-switch" aria-hidden="true"></i></button>
        </div>
        <div class="am-sec" role="group" aria-labelledby="amComfH">
          <div class="am-h" id="amComfH">Comfort</div>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-keep class="mn-row" id="mnMotion" data-comfort="motion"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.8 8c1.4-3.2 2.9-3.2 4.2 0s2.9 3.2 4.2 0 2.1-2.2 4-1"/></svg><span class="t">Reduce motion<small>No sliding, fading or easing</small></span><i class="mn-switch" aria-hidden="true"></i></button>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-keep class="mn-row" id="mnTransp" data-comfort="transparency"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2.2l5.6 3.1L8 8.4 2.4 5.3z"/><path d="M2.4 8.1L8 11.2l5.6-3.1M2.4 10.8L8 13.9l5.6-3.1"/></svg><span class="t">Reduce transparency<small>Solid panels instead of glass</small></span><i class="mn-switch" aria-hidden="true"></i></button>
          <button type="button" role="menuitemcheckbox" aria-checked="false" data-keep class="mn-row" id="mnContrast" data-comfort="contrast"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 2.4a5.6 5.6 0 010 11.2z" fill="currentColor"/></svg><span class="t">High contrast<small>Stronger text and borders</small></span><i class="mn-switch" aria-hidden="true"></i></button>
          <div class="am-row"><span class="am-lbl" id="mnTextLbl">Text size</span>
            <div class="mn-seg text-size" role="group" aria-labelledby="mnTextLbl">
              <button type="button" role="menuitemradio" aria-checked="true" data-keep data-text="m" aria-label="Default text size" title="Default">A</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-keep data-text="l" aria-label="Large text" title="Large">A</button>
              <button type="button" role="menuitemradio" aria-checked="false" data-keep data-text="xl" aria-label="Larger text" title="Larger">A</button>
            </div>
          </div>
        </div>
        <div class="am-sec" role="group" aria-labelledby="amHelpH">
          <div class="am-h" id="amHelpH">Help</div>
          <button type="button" role="menuitem" id="mnPalette"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><span>Search or jump to</span><kbd>⌘K</kbd></button>
          <button type="button" role="menuitem" id="mnKeys"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.8"/><path d="M4 7h1M7 7h1M10 7h2M4.5 10h7"/></svg><span>Keyboard shortcuts</span><kbd>?</kbd></button>
          <button type="button" role="menuitem" id="mnTour"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.6M8 5.2v.1"/></svg><span>Restart tour</span></button>
        </div>
        </div>
      </div>
    </div>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Search summary"></section>

<main class="work" id="work">
  <aside class="rail" id="rail" aria-label="Filters and ranking weights"></aside>
  <section class="results" id="results" aria-label="Results">
    <div class="results-h">
      <h2 id="listTitle"></h2><span class="sp"></span>
      <div class="seg" id="groupSeg" role="group" aria-label="Group results"><button type="button" data-g="units" class="on">Units</button><button type="button" data-g="buildings">Buildings</button></div>
      <select class="sel" id="sortSel" aria-label="Sort results">
        <option value="match">Best match</option><option value="cost">Lowest cost</option><option value="commute">Shortest commute</option><option value="size">Largest</option><option value="ppsf">Best $/ft²</option>
      </select>
    </div>
    <div class="fchips" id="filterChips" role="group" aria-label="Active filters" aria-hidden="true"></div>
    <div class="cards" id="cards"></div>
  </section>
  <div class="viewport" id="viewport">
    <nav class="subnav" id="subnav" aria-label="Shortlist sections" hidden></nav>
    <section class="view mapstage" id="view-map" aria-label="Map">
      <div id="map"></div>
      <div class="float layer-switch" id="layerSwitch" role="group" aria-label="Map layer"></div>
      <div class="float map-ctl" id="mapCtl"></div>
      <div class="float legend" id="legend"></div>
      <div class="float readout" id="readout" hidden></div>
      <div class="float map-offline" id="mapOffline" role="status" hidden><i aria-hidden="true"></i>Offline basemap<span class="more">· pins, lines and heat from local data</span></div>
      <div class="attrib" id="attrib"></div>
    </section>
    <section class="view" id="view-list" aria-label="Shortlist" hidden></section>
    <section class="view" id="view-compare" aria-label="Compare" hidden></section>
    <section class="view" id="view-unit" aria-label="Unit 3D" hidden></section>
    <section class="view" id="view-plan" aria-label="Floor plan" hidden></section>
    <section class="view" id="view-pair" aria-label="Compare in 3D" hidden></section>
    <section class="view" id="view-records" aria-label="Records" hidden></section>
    <section class="view" id="view-tours" aria-label="Tours" hidden></section>
    <section class="view" id="view-research" aria-label="Research" hidden></section>
    <aside class="drawer" id="drawer" aria-label="Listing details"></aside>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
