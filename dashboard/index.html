<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ApartmentScout</title>
<meta name="description" content="Rank apartments on your own criteria, map door-to-door commutes, read building records and model the light from the exact unit.">
<meta name="theme-color" content="#08090c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%238b96ff'/%3E%3Crect x='7' y='7' width='6' height='6' rx='1.4' fill='%230b0d1f'/%3E%3Crect x='15' y='7' width='6' height='6' rx='1.4' fill='%23f5b547'/%3E%3Crect x='7' y='15' width='6' height='6' rx='1.4' fill='%230b0d1f'/%3E%3Crect x='15' y='15' width='6' height='6' rx='1.4' fill='%230b0d1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/views/list.css">
<link rel="stylesheet" href="css/views/compare.css">
<link rel="stylesheet" href="css/views/unit.css">
<link rel="stylesheet" href="css/views/plan.css">
<link rel="stylesheet" href="css/views/records.css">
<link rel="stylesheet" href="css/views/tours.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body data-view="map">
<header class="topbar">
  <a class="brand" href="#map" aria-label="ApartmentScout home">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent-strong)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
      <rect width="28" height="28" rx="8" fill="url(#brandg)"/>
      <rect x="7" y="7" width="6" height="6" rx="1.4" fill="var(--accent-ink)" opacity=".9"/>
      <rect x="15" y="7" width="6" height="6" rx="1.4" fill="var(--sun)"/>
      <rect x="7" y="15" width="6" height="6" rx="1.4" fill="var(--accent-ink)" opacity=".9"/>
      <rect x="15" y="15" width="6" height="6" rx="1.4" fill="var(--accent-ink)" opacity=".9"/>
    </svg>
    <span>ApartmentScout</span>
  </a>
  <button class="search-switch" type="button" id="searchSwitch" title="This search"><i class="dot"></i><b id="searchName">Search</b></button>
  <nav class="nav" id="tabs" aria-label="Views">
    <a href="#map" data-view="map">Map</a>
    <a href="#list" data-view="list">Shortlist</a>
    <a href="#compare" data-view="compare">Compare<span class="count" id="cmpCount" hidden></span></a>
    <a href="#unit" data-view="unit">Unit 3D</a>
    <a href="#plan" data-view="plan">Floor plan</a>
    <a href="#records" data-view="records">Records</a>
    <a href="#tours" data-view="tours">Tours<span class="count" id="savedCount" hidden></span></a>
  </nav>
  <div class="top-actions">
    <button class="btn filters-btn" type="button" id="filtersBtn">Filters</button>
    <label class="cmdk" for="q"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/></svg><input id="q" type="search" placeholder="Search listings" aria-label="Search listings" style="all:unset;flex:1;min-width:0;color:var(--ink)"><kbd>/</kbd></label>
    <button class="icon-btn" type="button" data-act="csv" id="csvBtn" title="Export the filtered listings as CSV" aria-label="Export CSV"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10"/></svg></button>
    <button class="icon-btn" type="button" id="themeBtn" title="Light or dark (t)" aria-label="Switch theme"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 107 7z"/></svg></button>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Search summary"></section>

<main class="work" id="work">
  <aside class="rail" id="rail" aria-label="Filters and ranking weights"></aside>
  <section class="results" id="results" aria-label="Results">
    <div class="results-h">
      <h2 id="listTitle"></h2><span class="sp"></span>
      <div class="seg" id="groupSeg" role="group" aria-label="Group results"><button type="button" data-g="units" class="on">Units</button><button type="button" data-g="buildings">Buildings</button></div>
      <select class="sel" id="sortSel" aria-label="Sort results">
        <option value="match">Best match</option><option value="cost">Lowest cost</option><option value="commute">Shortest commute</option><option value="size">Largest</option><option value="ppsf">Best $/ft²</option>
      </select>
    </div>
    <div class="cards" id="cards"></div>
  </section>
  <div class="viewport" id="viewport">
    <section class="view mapstage" id="view-map" aria-label="Map">
      <div id="map"></div>
      <div class="float layer-switch" id="layerSwitch" role="group" aria-label="Map layer"></div>
      <div class="float map-ctl" id="mapCtl"></div>
      <div class="float legend" id="legend"></div>
      <div class="float readout" id="readout" hidden></div>
      <div class="attrib" id="attrib"></div>
    </section>
    <section class="view" id="view-list" aria-label="Shortlist" hidden></section>
    <section class="view" id="view-compare" aria-label="Compare" hidden></section>
    <section class="view" id="view-unit" aria-label="Unit 3D" hidden></section>
    <section class="view" id="view-plan" aria-label="Floor plan" hidden></section>
    <section class="view" id="view-records" aria-label="Records" hidden></section>
    <section class="view" id="view-tours" aria-label="Tours" hidden></section>
    <aside class="drawer" id="drawer" aria-label="Listing details"></aside>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
