<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Decision report · ApartmentScout</title>
<!--
  ApartmentScout decision report: ONE template for the dashboard's "Make a report" button (dashboard/js/features/report.js and
  report-model.js) and for `apartmentscout report --homes` (apartmentscout/report_doc.py). A builder fills the as-data block with a
  payload shaped by the as-schema block (and puts the Geist font into the as-fonts block); the scripts at the bottom draw the pages
  from it: a cover with the recommendation, a side-by-side table, one page per home, and a final checklist. Nothing is fetched at
  view time. The pages are US Letter or A4 sheets: on screen they sit on a desk, in print each is one page (Save as PDF).
  The `as-core` script holds every rule (which home leads and why, the table cells, what is still unknown, the checklist); it has no
  DOM so tests/js/report.test.mjs runs it under Node.
-->
<style id="as-fonts">/*as-fonts*/</style>
<style>
:root {
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ink: #12151c; --ink2: #3e4553; --ink3: #626a7a; --ink4: #9aa1ae;
  --line: #e4e6eb; --line2: #cdd1d9; --paper: #ffffff; --desk: #e7e8ec; --tint: #f6f6f3; --tint2: #eff0f3;
  --accent: #4b55e6; --accent-ink: #3a43d0; --accent-soft: #eceefd;
  --good: #0c7a4c; --good-soft: #e3f3ea; --warn: #8a5603; --warn-soft: #fbf0d9; --bad: #b4381f; --bad-soft: #fbe8e3; --sun: #c98a0a;
  --pw: 8.5in; --ph: 11in; --pad-x: .55in; --pad-y: .5in;
  --scale: 1;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 400 9.5pt/1.45 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; font-feature-settings: "tnum" 1, "ss01" 1; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img { display: block; }
a { color: var(--accent-ink); text-decoration: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- the screen toolbar (never printed) */
.tools { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: rgba(255,255,255,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.tools [hidden] { display: none !important; }
.tools .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; }
.tools .brand svg { width: 18px; height: 18px; }
.tools .sp { flex: 1; }
.tools .meta { color: var(--ink3); }
.tools label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--ink2); }
.tools select, .tools button { font: 500 12.5px var(--font); }
.tools select { height: 30px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line2); background: #fff; color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
.btn svg { width: 14px; height: 14px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.desk { padding: 22px 12px 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.fit { zoom: var(--scale); }

/* ---- a sheet is one page */
.sheet { position: relative; width: var(--pw); height: var(--ph); background: var(--paper); box-shadow: 0 1px 2px rgba(20,24,34,.08), 0 14px 40px rgba(20,24,34,.12); overflow: hidden;
  padding: var(--pad-y) var(--pad-x) .42in; display: flex; flex-direction: column; break-after: page; page-break-after: always; }
.sheet:last-child { break-after: auto; page-break-after: auto; }
.run { display: flex; align-items: center; gap: 10px; height: .22in; flex: none; font-size: 7pt; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); border-bottom: 1px solid var(--line); padding-bottom: 5px; margin-bottom: 14px; }
.run b { font-weight: 600; color: var(--ink2); letter-spacing: .08em; }
.run .sp { flex: 1; }
.run .mark { width: 11px; height: 12px; }
.foot { position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: .22in; display: flex; gap: 12px; font-size: 6.8pt; color: var(--ink3); border-top: 1px solid var(--line); padding-top: 5px; }
.foot .sp { flex: 1; }
.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.eyebrow { font-size: 7.4pt; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.k { font-size: 7pt; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
.h2 { font-size: 7.6pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); padding-bottom: 5px; border-bottom: 1px solid var(--line2); margin-bottom: 7px; display: flex; align-items: baseline; gap: 8px; }
.h2 small { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink3); font-size: 7.4pt; }
.muted { color: var(--ink3); }
.unk { color: var(--ink3); font-style: normal; }
.pill { display: inline-flex; align-items: center; height: 15px; padding: 0 7px; border-radius: 99px; background: var(--tint2); color: var(--ink2); font-size: 7pt; font-weight: 600; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.photo { position: relative; background: var(--tint2); overflow: hidden; border-radius: 8px; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo .cap { position: absolute; left: 6px; bottom: 5px; max-width: 90%; padding: 1px 6px; border-radius: 4px; background: rgba(12,14,20,.62); color: #fff; font-size: 6.4pt; }
.ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--ink3); font-size: 7.6pt; text-align: center; padding: 8px; background: repeating-linear-gradient(135deg, var(--tint2) 0 8px, var(--tint) 8px 16px); }

/* ---- cover */
.cover .top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.cover .t { flex: 1; min-width: 0; }
.cover h1 { font-size: 31pt; line-height: 1.04; letter-spacing: -.03em; font-weight: 650; margin: 5px 0 4px; }
.cover .addr { color: var(--ink2); font-size: 10.5pt; }
.cover .verdict { font-size: 12.6pt; line-height: 1.38; letter-spacing: -.01em; color: var(--ink); margin: 12px 0 0; max-width: 6.6in; font-weight: 450; }
.cover .hero { flex: 1 1 2.4in; min-height: 2.4in; max-height: 4.1in; margin-top: 14px; border-radius: 10px; }
.ring { position: relative; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 650; letter-spacing: 0; }
.why { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; flex: none; }
.why > div { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px 10px; background: var(--tint); }
.why .n { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 7.4pt; font-weight: 650; margin-right: 6px; }
.why h3 { font-size: 9.6pt; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; }
.why .d { font-size: 7.6pt; color: var(--good); font-weight: 650; margin: 3px 0 2px; }
.why p { font-size: 8.2pt; color: var(--ink2); line-height: 1.4; }
.rank { margin-top: 14px; flex: none; }
.rank li { display: grid; grid-template-columns: 24px minmax(0, 1.5fr) 38px minmax(0, 1fr) minmax(0, 1.35fr); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rank li:last-child { border-bottom: 0; }
.rank .let { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 650; font-size: 9pt; }
.rank li.lead .let { background: var(--accent); }
.rank .nm b { font-weight: 650; display: block; font-size: 9.4pt; letter-spacing: -.01em; }
.rank .nm span { color: var(--ink3); font-size: 7.6pt; }
.rank .mo b { font-weight: 650; font-size: 10pt; } .rank .mo span { display: block; color: var(--ink3); font-size: 7.2pt; }
.rank .vd { font-size: 7.8pt; color: var(--ink2); line-height: 1.35; }
.watch { margin-top: 14px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 8px 12px 9px; flex: none; }
.watch h3 { font-size: 7.6pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--warn); margin-bottom: 3px; }
.watch li { font-size: 8.3pt; color: var(--ink2); padding-left: 11px; position: relative; line-height: 1.4; }
.watch li::before { content: ""; position: absolute; left: 1px; top: .62em; width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
.cover .small { margin-top: 8px; font-size: 7.4pt; color: var(--ink3); flex: none; }

/* ---- the table */
.pg-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex: none; }
.pg-title h2 { font-size: 20pt; letter-spacing: -.025em; font-weight: 650; }
.pg-title p { color: var(--ink3); font-size: 8.4pt; flex: 1; text-align: right; }
table.cmp { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 8.5pt; }
.cmp col.lab { width: 1.72in; }
.cmp th, .cmp td { padding: 2.9px 8px 2.9px 0; vertical-align: top; text-align: left; border-bottom: 1px solid var(--line); }
.cmp thead th { border-bottom: 1.5px solid var(--ink); padding-bottom: 7px; vertical-align: top; }
.cmp .hd { display: block; }
.cmp .hd .photo { height: .68in; margin-bottom: 5px; border-radius: 6px; }
.cmp .hd .nm { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 8.8pt; line-height: 1.2; letter-spacing: -.01em; }
.cmp .hd .let { flex: none; width: 17px; height: 17px; border-radius: 5px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 8pt; }
.cmp .hd .lead .let, .cmp .hd.lead .let { background: var(--accent); }
.cmp .hd small { display: block; color: var(--ink3); font-weight: 400; font-size: 7.2pt; margin: 2px 0 0 23px; }
.cmp tr.sec td { padding: 7px 0 2px; border-bottom: 0; font-size: 7pt; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.cmp td.l { color: var(--ink2); font-weight: 500; padding-right: 10px; }
.cmp td.l small { display: block; color: var(--ink3); font-weight: 400; font-size: 6.8pt; line-height: 1.25; }
.cmp td .v { font-weight: 600; font-size: 8.8pt; letter-spacing: -.005em; }
.cmp td .s { display: block; color: var(--ink3); font-size: 6.9pt; line-height: 1.25; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp td .v { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmp td { padding-right: 7px; }
.cmp td .v.wrap { white-space: normal; line-height: 1.25; }
.cmp.n4 { font-size: 8pt; } .cmp.n4 td .v { font-size: 8.4pt; } .cmp.n4 td .s { font-size: 6.5pt; } .cmp.n4 col.lab { width: 1.5in; } .cmp.n4 .hd .photo { height: .46in; } .cmp.n4 .hd .nm { font-size: 8.2pt; }
.cmp td.best { background: linear-gradient(0deg, var(--good-soft), var(--good-soft)); box-shadow: -6px 0 0 var(--good-soft); }
.cmp td.best .v { color: var(--good); }
.cmp td .v.bad { color: var(--bad); } .cmp td .v.warn { color: var(--warn); }
.keyline { display: flex; gap: 14px; align-items: center; font-size: 7.2pt; color: var(--ink3); margin-top: 8px; flex: none; }
.keyline i { display: inline-block; width: 12px; height: 9px; border-radius: 2px; background: var(--good-soft); border: 1px solid #b9dfca; margin-right: 5px; vertical-align: -1px; }

/* ---- a home */
.hm .head { display: flex; align-items: flex-start; gap: 12px; flex: none; }
.hm .head .t { flex: 1; min-width: 0; }
.hm .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; align-items: center; }
.hm .let { width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font-weight: 650; font-size: 9pt; }
.hm .let.lead { background: var(--accent); }
.hm h2 { font-size: 19pt; line-height: 1.08; letter-spacing: -.025em; font-weight: 650; }
.hm .addr { color: var(--ink2); font-size: 9pt; margin-top: 2px; }
.hm .hero { height: 2.46in; margin-top: 10px; flex: none; }
.hm.tour .hero { height: 1.78in; }
.hm .vis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; height: 2.02in; flex: none; }
.hm.tour .vis { height: 1.8in; }
.card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; background: var(--tint); display: flex; flex-direction: column; min-width: 0; }
.card .ct span:first-child { white-space: nowrap; }
.card .ct span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; letter-spacing: .04em; }
.card .ct { font-size: 6.8pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); padding: 6px 9px 0; flex: none; display: flex; justify-content: space-between; gap: 6px; }
.card .cb { flex: 1; min-height: 0; position: relative; }
.card .cb svg, .card .cb img { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .cb img { object-fit: cover; }
.card .cn { flex: none; padding: 4px 9px 6px; font-size: 6.9pt; color: var(--ink3); line-height: 1.3; }
.card.still { background: #dfe7f5; } .card.still .ct { color: var(--ink2); background: rgba(255,255,255,.55); padding-bottom: 5px; }
.card .sun { position: absolute; right: 7px; bottom: 6px; background: rgba(255,255,255,.88); border-radius: 6px; padding: 3px 6px 3px; font-size: 6.4pt; color: var(--ink2); }
.card .sun svg { position: static; width: 70px; height: 20px; display: block; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; flex: none; }
.strip > div { padding: 6px 10px 7px; border-right: 1px solid var(--line); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip b { display: block; font-size: 13pt; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin-top: 1px; }
.strip span { color: var(--ink3); font-size: 7pt; display: block; line-height: 1.3; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 11px; flex: 1; min-height: 0; overflow: hidden; }
.cols > div { min-width: 0; }
.bars li { display: grid; grid-template-columns: .98in 1fr 26px; gap: 7px; align-items: center; font-size: 7.8pt; height: 14px; }
.bars .tr { height: 5px; border-radius: 3px; background: var(--tint2); position: relative; overflow: hidden; }
.bars .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.bars li.unk .tr { background: repeating-linear-gradient(90deg, var(--line2) 0 3px, transparent 3px 6px); }
.bars .nv { text-align: right; font-weight: 600; color: var(--ink2); }
.bars small { color: var(--ink4); font-size: 6.5pt; }
.bl li { position: relative; padding-left: 11px; margin-bottom: 3px; font-size: 8pt; line-height: 1.38; color: var(--ink2); }
.bl li::before { content: ""; position: absolute; left: 1px; top: .6em; width: 4px; height: 4px; border-radius: 50%; background: var(--ink4); }
.bl.warn li::before { background: var(--warn); }
.bl.ask li::before { background: none; border: 1px solid var(--accent); width: 5px; height: 5px; border-radius: 1.5px; top: .5em; }
.bl li b { color: var(--ink); font-weight: 600; }
.sub-h { font-size: 7pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); margin: 8px 0 4px; }
.sub-h:first-child { margin-top: 0; }
.tourbox { margin-top: 9px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 9px; background: #fff; flex: none; }
.tourbox .th { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.tourbox .th b { font-size: 7.4pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); }
.tourbox .th span { color: var(--ink3); font-size: 7.4pt; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 5px; }
.facts .f { display: inline-flex; gap: 5px; align-items: baseline; height: 17px; padding: 0 7px; border-radius: 5px; background: var(--tint2); font-size: 7.4pt; color: var(--ink2); }
.facts .f b { font-weight: 650; color: var(--ink); } .facts .f.bad { background: var(--bad-soft); color: var(--bad); } .facts .f.good { background: var(--good-soft); color: var(--good); } .facts .f.warn { background: var(--warn-soft); color: var(--warn); }
.tnote { margin-top: 5px; font-size: 8pt; color: var(--ink2); line-height: 1.4; }
.tphotos { display: flex; gap: 6px; margin-top: 6px; }
.tphotos figure { width: .98in; }
.tphotos .photo { height: .62in; border-radius: 5px; }
.tphotos figcaption { font-size: 6.4pt; color: var(--ink3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hide-notes .note { display: none !important; }

/* ---- the checklist */
.ck { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; overflow: hidden; align-content: start; }
.ck section { margin-bottom: 14px; break-inside: avoid; }
.ck h3 { font-size: 7.8pt; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); padding-bottom: 5px; border-bottom: 1.5px solid var(--ink); margin-bottom: 4px; }
.ck h3 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink3); font-size: 7.6pt; margin-left: 5px; }
.ck li { display: grid; grid-template-columns: 13px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 8.5pt; line-height: 1.38; }
.ck li .box { width: 11px; height: 11px; border: 1.2px solid var(--ink3); border-radius: 3px; margin-top: 2px; }
.ck li small { display: block; color: var(--ink3); font-size: 7.1pt; line-height: 1.3; margin-top: 1px; }
.sign { margin-top: auto; display: flex; gap: 26px; padding-top: 12px; flex: none; }
.sign div { flex: 1; border-top: 1px solid var(--line2); padding-top: 4px; font-size: 7pt; color: var(--ink3); }

.tools .short { display: none; }
@media screen and (max-width: 900px) { .tools .meta { display: none; } }
@media screen and (max-width: 640px) {
  .tools { gap: 8px; padding: 8px 10px; font-size: 12px; } .tools .bt, .tools .pl { display: none; } .tools .long { display: none; } .tools .short { display: inline; }
  .tools .btn { padding: 0 12px; } .tools select { max-width: 112px; }
}
@media screen { .sheet { border-radius: 2px; } }
@media print {
  html, body { background: #fff; }
  .tools { display: none !important; }
  .desk { padding: 0; gap: 0; display: block; }
  .fit { zoom: 1 !important; }
  .sheet { box-shadow: none; border-radius: 0; margin: 0; }
}
</style>
</head>
<body>
<header class="tools" id="tools">
  <span class="brand"><svg viewBox="10 10 80 88" aria-hidden="true"><path d="M50 95C50 95 15.5 57.5 15.5 40A34.5 34.5 0 1 1 84.5 40C84.5 57.5 50 95 50 95ZM75 40A25 25 0 1 1 25 40A25 25 0 1 1 75 40Z" fill="#12865f" fill-rule="evenodd"/><path d="M49.25 29L50 16.5L50.75 29ZM48 29H52V36.6H48ZM46 36.6H54V39.2H46ZM44 39.2H56V42.2H44ZM42 42.2H58V47.8H42ZM40 47.8H60V70H40Z" fill="currentColor"/></svg><span class="bt">Decision report</span></span>
  <span class="meta" id="meta"></span>
  <span class="sp"></span>
  <label id="notesTog" hidden><input type="checkbox" id="notes" checked> <span>Show my notes</span></label>
  <label><span class="pl">Paper</span> <select id="paper" aria-label="Paper size"><option value="letter">US Letter</option><option value="a4">A4</option></select></label>
  <button type="button" class="btn primary" id="print"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4.5 6V2h7v4M4.5 12H3a1 1 0 01-1-1V7a1 1 0 011-1h10a1 1 0 011 1v4a1 1 0 01-1 1h-1.5M4.5 9.5h7V14h-7z"/></svg><span class="long">Print or save as PDF</span><span class="short">Print</span></button>
</header>
<main class="desk" id="desk"><noscript><p>This report is drawn by a small script on the page. Turn JavaScript on to read it.</p></noscript></main>

<script type="application/json" id="as-schema">
{

  const seg = (e) => (Array.isArray(e.a) && Array.isArray(e.b) ? [P(e.a), P(e.b)] : [P([e.x1, e.y1]), P([e.x2, e.y2])]);

  for (const w of plan.windows || []) if (ok(w)) { const [a, b] = seg(w); s += `<line x1="${num(a[0])}" y1="${num(a[1])}" x2="${num(b[0])}" y2="${num(b[1])}" stroke="#fff" stroke-width="${num(sw * 3.4)}"/><line x1="${num(a[0])}" y1="${num(a[1])}" x2="${num(b[0])}" y2="${num(b[1])}" stroke="#3b8fe0" stroke-width="${num(sw * 2.4)}" stroke-linecap="round"/>`; }

    s += `<text x="${num(cx)}" y="${num(cy - (rect ? fs * 0.15 : -fs * 0.3))}" text-anchor="middle" font-size="${num(fs)}" font-weight="600" fill="#2a2f3a" font-family="Geist, system-ui, sans-serif">${esc(r.name || '')}</text>`;

}

// ---------------------------------------------------------------- one home

// ---------------------------------------------------------------- the page
function paper(kind, again) {
  const a4 = kind === 'a4', root = document.documentElement;
  root.style.setProperty('--pw', a4 ? '210mm' : '8.5in'); root.style.setProperty('--ph', a4 ? '297mm' : '11in');
  let st = document.getElementById('as-page'); if (!st) { st = document.createElement('style'); st.id = 'as-page'; document.head.appendChild(st); }
  st.textContent = `@page { size: ${a4 ? 'A4' : 'letter'}; margin: 0; }`;
  document.getElementById('paper').value = a4 ? 'a4' : 'letter';
  fit();
  if (again) { render(); trim(); }   // drawn afresh, so a line trimmed for one paper size comes back for the other; at start the fonts are not ready yet, and boot() trims once they are
  if (window.__report) window.__report.overflow = checkOverflow();   // the sheets changed size: look again for clipped content
}
function fit() {
  const sheet = document.querySelector('.sheet'); if (!sheet) return;
  const w = sheet.offsetWidth || 816, avail = Math.max(280, window.innerWidth - 24);
  desk.style.setProperty('--scale', String(Math.min(1, avail / w)));
}
/** A home page whose columns would run past the sheet gives up its last open question, then its last unknown, then its last records flag,
 *  until it fits: the checklist page still asks every question, so nothing is lost, and a page never prints clipped. */
function trim() {
  document.querySelectorAll('.sheet[data-kind=home] .cols').forEach((cols) => {
    for (const sel of ['.bl.ask li', '.bl.warn li']) {
      let guard = 12;
      while (cols.scrollHeight > cols.clientHeight + 1 && guard-- > 0) {
        const items = cols.querySelectorAll(sel);
        if (items.length <= 1) break;
        items[items.length - 1].remove();
      }
    }
  });
}
function checkOverflow() {
  const bad = [];
  document.querySelectorAll('.sheet').forEach((sh, i) => {
    const box = sh.getBoundingClientRect(), fillEl = sh.querySelector('.fill');
    let over = fillEl && fillEl.scrollHeight > fillEl.clientHeight + 1;
    sh.querySelectorAll('.cols, .ck').forEach((e) => { if (e.scrollHeight > e.clientHeight + 1) over = true; });
    const f = sh.querySelector('.foot').getBoundingClientRect();
    sh.querySelectorAll('.fill > *').forEach((e) => { if (e.getBoundingClientRect().bottom > f.top + 1 && !e.classList.contains('foot')) over = true; });
    if (over) bad.push(i + 1);
    void box;
  });
  return bad;
}
function render() {
  if (!P || !Array.isArray(P.homes) || P.homes.length < 1) { desk.innerHTML = '<p style="padding:40px">This report has no homes in it.</p>'; return; }
  const rec = R.recommend(P), H = P.homes, total = H.length + 3;
  const pages = [cover(1, total, rec), table(2, total, rec), ...rec.order.map((_, k) => home(rec.order[k], k + 3, total, rec)), checklistPage(total, total)];
  // the homes keep their letters (A, B, ...) but are listed best first, so the letter says which one it is in the table
  desk.innerHTML = `<div class="fit" id="fit">${pages.join('')}</div>`;
  document.title = `Decision report: ${H.map((h) => R.name(h)).join(' vs ')}`;
  document.getElementById('meta').textContent = `${H.length} homes · ${dateLabel(P.generated)}`;
  // a photo that cannot be read leaves its frame with a plain label instead of a broken-image icon
  desk.querySelectorAll('img').forEach((im) => {
    const bad = () => { const f = im.closest('.photo, .cb'); if (f) { im.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', textContent: 'Photo unavailable' })); } else im.remove(); };
    im.addEventListener('error', bad); if (im.complete && im.naturalWidth === 0) bad();
  });
}
function boot() {
  render();
  const tog = document.getElementById('notes');
  if (P && P.notes) { document.getElementById('notesTog').hidden = false; tog.addEventListener('change', () => document.body.classList.toggle('hide-notes', !tog.checked)); }
  document.body.classList.toggle('hide-notes', !(P && P.notes));
  paper(new URLSearchParams(location.search).get('paper') || (P && P.paper) || 'letter');
  document.getElementById('paper').addEventListener('change', (e) => paper(e.target.value, true));
  document.getElementById('print').addEventListener('click', () => window.print());
  addEventListener('resize', fit);
  const done = () => { trim(); window.__report = { ready: true, pages: document.querySelectorAll('.sheet').length, overflow: checkOverflow(), homes: P ? P.homes.length : 0 }; document.body.dataset.ready = '1'; };
  const imgs = [...document.images];
  Promise.all(imgs.map((im) => (im.complete ? 0 : new Promise((r) => { im.addEventListener('load', r); im.addEventListener('error', r); })))).then(() => (document.fonts && document.fonts.ready ? document.fonts.ready : 0)).then(() => requestAnimationFrame(done));
  if (location.hash === '#print') setTimeout(() => window.print(), 600);
}
boot();
})();
</script>
