<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Shortlist · ApartmentScout</title>
<!--
  ApartmentScout shared shortlist and decision memo: ONE template for the dashboard's "Share shortlist" / "Decision memo"
  buttons and for `apartmentscout share`. A builder (dashboard/js/features/share-model.js in the browser,
  apartmentscout/share.py on the command line) fills the as-data block below with a payload shaped by the as-schema block
  and writes this file out. Everything on the page is drawn from that payload by the script at the bottom: no network, no
  libraries, no fonts to fetch. Photos are embedded thumbnails or links.
-->
<style>
:root {
  color-scheme: dark;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg: #08090c; --s1: #0e1015; --s2: #13161d; --s3: #1a1e27; --hover: #1e2330;
  --line: rgba(255,255,255,.075); --line2: rgba(255,255,255,.13);
  --ink: #eef1f6; --ink2: #a9b1bf; --ink3: #8a94a6; --ink4: #4a5160;
  --accent: #8b96ff; --accent2: #a6aeff; --accent-ink: #0b0d1f; --accent-soft: rgba(139,150,255,.13); --accent-line: rgba(139,150,255,.38);
  --good: #4fd19a; --warn: #f0b04c; --bad: #f2735f; --sun: #f5b547; --fav: #ffd166;
  --good-soft: rgba(79,209,154,.12); --warn-soft: rgba(240,176,76,.12); --bad-soft: rgba(242,115,95,.12);
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 12px 34px rgba(0,0,0,.4);
  --r: 14px; --r2: 10px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f4f1; --s1: #ffffff; --s2: #fafaf8; --s3: #f1f1ed; --hover: #eeeee9;
  --line: rgba(20,24,34,.08); --line2: rgba(20,24,34,.14);
  --ink: #12151c; --ink2: #4b5261; --ink3: #656c7b; --ink4: #aab0bc;
  --accent: #4b55e6; --accent2: #3a43d0; --accent-ink: #fff; --accent-soft: rgba(75,85,230,.09); --accent-line: rgba(75,85,230,.34);
  --good: #0c7a4c; --warn: #8f5a03; --bad: #bd3d27; --sun: #b97a0a; --fav: #7a5700;
  --good-soft: rgba(19,148,94,.09); --warn-soft: rgba(183,116,6,.1); --bad-soft: rgba(207,70,48,.09);
  --shadow: 0 10px 28px rgba(20,24,34,.1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: var(--accent2); text-decoration: none; } a:hover { text-decoration: underline; }
p a, .legal a, .foot a, .m-home a { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

/* ---- top bar */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; height: 52px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
.brand svg { width: 20px; height: 20px; }
.ro { white-space: nowrap; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 3px 8px; border: 1px solid var(--line2); border-radius: 999px; }
.sp { flex: 1; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: color-mix(in srgb, var(--ink) 6%, transparent); border: 1px solid var(--line); }
.seg button { height: 28px; padding: 0 14px; border: 0; border-radius: 8px; background: none; color: var(--ink2); font: 500 12.5px var(--font); cursor: pointer; }
.seg .short { display: none; }
.seg button[aria-pressed="true"] { background: var(--s1); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line2); background: var(--s2); color: var(--ink); font: 500 13px var(--font); cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn svg { width: 15px; height: 15px; }
.icon { width: 34px; padding: 0; justify-content: center; }

/* ---- head */
.head { padding: 34px 0 20px; display: grid; gap: 18px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--accent2); }
.head h1 { font-size: clamp(26px, 4vw, 40px); line-height: 1.08; letter-spacing: -.025em; font-weight: 650; margin-top: 6px; }
.head .sub { margin-top: 8px; color: var(--ink2); font-size: 15px; max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { min-width: 120px; padding: 11px 14px; border-radius: var(--r2); background: var(--s1); border: 1px solid var(--line); }
.stat b { display: block; font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.stat span { font-size: 11.5px; color: var(--ink3); }

/* ---- overview: map + ranked list */
.overview { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-bottom: 26px; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.map { position: relative; background: var(--s2); }
.map svg { display: block; width: 100%; height: auto; }
.map .bg { fill: var(--s2); }
.map .tl { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.map .pin circle { fill: var(--accent); stroke: var(--s1); stroke-width: 2.4; }
.map .pin text { fill: var(--accent-ink); font: 650 11px var(--font); text-anchor: middle; }
.map .pin.t1 circle { stroke: var(--fav); stroke-width: 3.2; }
.map .dest rect { fill: #0f8f5a; stroke: var(--s1); stroke-width: 2; }
.map .dest text { fill: var(--ink); font: 600 11px var(--font); paint-order: stroke; stroke: var(--s2); stroke-width: 3px; text-anchor: middle; }
.map .cap { position: absolute; left: 10px; bottom: 9px; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--s1) 88%, transparent); font-size: 11px; color: var(--ink3); }
.rank-list { list-style: none; margin: 0; padding: 6px; }
.rank-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; }
.rank-list li:hover { background: var(--s2); }
.rank-list .n { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent2); font: 650 12px var(--font); }
.rank-list .t b { font-weight: 600; } .rank-list .t small { display: block; color: var(--ink3); font-size: 12px; }
.rank-list .sc { display: block; } .rank-list .p { font-weight: 650; text-align: right; } .rank-list .p small { display: block; font-weight: 500; font-size: 11.5px; color: var(--ink3); }

/* ---- cards */
.cards { display: grid; gap: 18px; padding-bottom: 60px; }
.home { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.media { position: relative; background: var(--s3); min-height: 240px; display: flex; flex-direction: column; }
.media .main { position: relative; flex: 1; min-height: 190px; }
.media .main img, .media .main svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .thumbs { display: flex; gap: 4px; padding: 4px; background: var(--s1); }
.media .thumbs button { flex: 1; height: 46px; padding: 0; border: 2px solid transparent; border-radius: 7px; overflow: hidden; background: var(--s3); cursor: pointer; opacity: .75; }
.media .thumbs button[aria-current="true"] { border-color: var(--accent); opacity: 1; }
.media .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge-rank { position: absolute; z-index: 2; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, #05060a 70%, transparent); color: #fff; font: 650 12.5px var(--font); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.credit { position: absolute; z-index: 2; right: 8px; bottom: 8px; max-width: 85%; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, #05060a 66%, transparent); color: #e8ebf2; font-size: 10.5px; }
.body { padding: 18px 20px 16px; display: grid; gap: 13px; align-content: start; min-width: 0; }
.row1 { display: flex; gap: 14px; align-items: flex-start; }
.row1 .t { flex: 1; min-width: 0; }
.row1 h3 { font-size: 20px; letter-spacing: -.02em; font-weight: 650; line-height: 1.2; }
.row1 h3 span { color: var(--ink2); font-weight: 500; }
.row1 p { margin-top: 3px; color: var(--ink3); font-size: 13px; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; font-weight: 650; line-height: 1; letter-spacing: 0; }
.ring.sm b { font-size: 12px; } .ring.md b { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--s3); color: var(--ink2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent2); } .chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.fav { background: color-mix(in srgb, var(--fav) 14%, transparent); color: var(--fav); }
.price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.price b { font-size: 30px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.price .per { color: var(--ink3); font-size: 13px; margin-left: -8px; }
.price .gross { color: var(--ink3); font-size: 13px; }
.price abbr { text-decoration: underline dotted; cursor: help; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink2); }
.facts b { color: var(--ink); font-weight: 600; }
.commute { font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.commute b { color: var(--ink); font-size: 15px; }
.commute .m { color: var(--ink3); }
.why h4, .sec h4 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 7px; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.reasons li { display: grid; grid-template-columns: 44px 84px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 13px; }
.reasons .pts { font-weight: 650; text-align: right; } .reasons .pts.pos { color: var(--good); } .reasons .pts.neg { color: var(--bad); } .reasons .pts.zero { color: var(--ink3); }
.reasons .lab { color: var(--ink); font-weight: 550; } .reasons .txt { color: var(--ink2); }
.foot { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; color: var(--ink3); font-size: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
details.more { border-top: 1px solid var(--line); }
details.more > summary { cursor: pointer; list-style: none; padding: 11px 0 2px; font-size: 12.5px; font-weight: 600; color: var(--accent2); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; } details.more[open] > summary::before { content: "▾ "; }
.tables { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; padding-top: 12px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink3); padding: 4px 12px 4px 0; vertical-align: top; width: 46%; }
.tbl td { padding: 4px 0; text-align: right; font-weight: 550; }
.tbl tr + tr > * { border-top: 1px solid var(--line); }
.tbl td small, .tbl th small { display: block; color: var(--ink3); font-weight: 400; font-size: 11.5px; }
.tbl tr.tot th, .tbl tr.tot td { color: var(--ink); font-weight: 650; }
.est { color: var(--warn); } .unk { color: var(--ink3); font-weight: 500; font-style: italic; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink2); }
.bar-row .tr { height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; } .bar-row .tr i { display: block; height: 100%; border-radius: 3px; }
.bar-row b { text-align: right; color: var(--ink); font-weight: 650; }
.bar-row.unknown .tr { background: repeating-linear-gradient(45deg, var(--s3) 0 4px, transparent 4px 8px); }
.sun { display: flex; align-items: flex-end; gap: 3px; height: 38px; margin: 4px 0 2px; }
.sun div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 9.5px; color: var(--ink3); gap: 2px; }
.sun i { display: block; width: 100%; border-radius: 2px; background: var(--sun); min-height: 2px; opacity: .9; }
.legs { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink2); }
.dots { letter-spacing: 2px; color: var(--accent2); } .dots i { color: var(--ink4); font-style: normal; }
.q { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink2); display: grid; gap: 4px; }
.mynote { padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13px; white-space: pre-wrap; }
.glyph text { font: 500 11px var(--font); fill: var(--ink3); }
.empty { padding: 80px 20px; text-align: center; color: var(--ink2); }
.legal { margin: 8px 0 60px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 12px; line-height: 1.6; max-width: 90ch; }

/* ---- memo layout */
body[data-view="memo"] .cards-view, body[data-view="cards"] .memo-view { display: none; }
.memo-view { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); margin: 6px 0 60px; padding: 44px 52px; box-shadow: var(--shadow); }
.memo h1 { font-size: 30px; letter-spacing: -.025em; font-weight: 650; margin: 4px 0 6px; }
.memo .lead { color: var(--ink2); max-width: 70ch; }
.memo h2 { font-size: 18px; letter-spacing: -.015em; font-weight: 650; margin: 32px 0 10px; }
.memo .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 36px; }
.rt { width: 100%; border-collapse: collapse; font-size: 13px; }
.rt th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); padding: 6px 8px; border-bottom: 1.5px solid var(--line2); white-space: nowrap; }
.rt td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rt .n { text-align: right; white-space: nowrap; }
.rt td b { font-weight: 600; } .rt td small { display: block; color: var(--ink3); font-size: 11.5px; }
.wline { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 22px; }
.wline .k { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); margin-right: 6px; }
.wc { padding: 3px 10px; border-radius: 999px; background: var(--s3); font-size: 12.5px; color: var(--ink2); } .wc b { color: var(--ink); font-weight: 650; }
.how { margin-top: 12px; font-size: 12.5px; color: var(--ink3); max-width: 90ch; }
.m-home { margin-top: 38px; padding-top: 26px; border-top: 2px solid var(--line2); }
.m-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
.m-head .rk { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 650 16px var(--font); }
.m-head h2 { margin: 0; font-size: 22px; } .m-head p { color: var(--ink3); margin-top: 2px; }
.m-head .price { margin-left: auto; text-align: right; display: block; } .m-head .price .per { margin-left: 2px; } .m-head .price b { font-size: 26px; } .m-head .price small { display: block; color: var(--ink3); font-size: 12px; margin-top: 2px; min-height: 1em; }
.m-photos { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; margin-bottom: 18px; height: 300px; }
.m-photos.n3 div:first-child { grid-row: 1 / 3; }
.m-photos.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; } .m-photos.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.m-photos div { position: relative; border-radius: 9px; overflow: hidden; background: var(--s3); min-height: 0; }
.m-photos img, .m-photos svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-sec { break-inside: avoid; margin-bottom: 4px; }
.m-sec h4 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1.5px solid var(--line2); }
.m-sec + .m-sec { margin-top: 16px; }
.sign { margin-top: 34px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; font-size: 12px; color: var(--ink3); }
.sign div { border-top: 1px solid var(--ink4); padding-top: 6px; }

@media screen and (max-width: 860px) {
  .overview { grid-template-columns: 1fr; }
  .home { grid-template-columns: 1fr; }
  .media .main { min-height: 220px; }
  .tables, .memo .grid2 { grid-template-columns: 1fr; }
  .memo-view { padding: 24px 18px; }
  .bar .wrap { gap: 8px; } .brand span { display: none; } .ro { display: none; } .seg .long { display: none; } .seg .short { display: inline; } .seg button { padding: 0 11px; }
  .btn .lbl { display: none; } .btn { padding: 0 10px; }
  .rank-list li { grid-template-columns: 26px minmax(0, 1fr) auto; } .rank-list .sc { display: none; }
  .reasons li { grid-template-columns: 40px 1fr; } .reasons .txt { grid-column: 2; margin-top: -2px; }
  .m-photos { height: auto; grid-template-columns: 1fr 1fr; grid-template-rows: auto; } .m-photos.n3 div:first-child { grid-row: auto; grid-column: 1 / -1; } .m-photos div { aspect-ratio: 4/3; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

/* ---- print: the memo is the document; cards print too, one home per block */
@page { margin: 13mm 12mm; }
@media print {
  :root, :root[data-theme="dark"], :root[data-theme="light"] {
    color-scheme: light; --bg: #fff; --s1: #fff; --s2: #f7f7f5; --s3: #efefec; --line: #e2e2dd; --line2: #cfcfc8; --ink: #14171e; --ink2: #3c4250; --ink3: #5b6272; --ink4: #9aa0ac;
    --accent: #3b45cf; --accent2: #3b45cf; --accent-ink: #fff; --accent-soft: #eceefc; --accent-line: #c9cdf3; --good: #0b6b42; --warn: #805000; --bad: #a8321f; --sun: #b97a0a; --fav: #9a6c00;
    --good-soft: #e5f4ec; --warn-soft: #fbf0dc; --bad-soft: #fbe8e4; --shadow: none;
  }
  body { font-size: 10.5pt; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar, .no-print, .thumbs, details.more > summary { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .head { padding-top: 0; }
  .panel, .home, .memo-view, .stat { box-shadow: none; }
  .memo-view { border: 0; padding: 0; margin: 0; }
  .home { break-inside: avoid; margin-bottom: 10px; grid-template-columns: 62mm 1fr; }
  details.more > :not(summary) { display: block; }
  details.more { border: 0; }
  .m-home { break-before: page; margin-top: 0; padding-top: 0; border-top: 0; }
  .m-home .grid2 { display: block; column-count: 2; column-gap: 9mm; }
  .m-home .grid2 > div { display: contents; }
  .m-home .m-sec { break-inside: avoid; }
  .memo-view { font-size: 9.6pt; line-height: 1.4; }
  .m-photos { height: 46mm; margin-bottom: 6mm; gap: 4px; }
  .m-head { margin-bottom: 8px; } .m-head h2 { font-size: 17pt; } .m-head .price b { font-size: 19pt; }
  .m-home .tbl { font-size: 9.2pt; } .m-home .tbl th, .m-home .tbl td { padding: 2px 0; }
  .m-sec + .m-sec { margin-top: 9px; } .m-home .m-sec h4 { margin-bottom: 3px; padding-bottom: 3px; }
  .m-home .reasons li { font-size: 9.2pt; } .m-home .reasons { gap: 3px; }
  .m-home .bar-row { font-size: 9.2pt; } .m-home .sun { height: 26px; }
  .wline, .rt { break-inside: avoid; }

}
function trailHTML(h) {

const tourBlock = (h) => (h.tour || h.trail?.length ? `<div class="tour-wrap">${h.tour ? `<div class="sec wide"><h4>On the visit</h4>${tourHTML(h)}</div>` : ''}${h.trail?.length ? `<div class="sec wide"><h4>Decision trail</h4>${trailHTML(h)}</div>` : ''}</div>` : '');

const dots = (n) => { const k = Math.max(0, Math.min(5, Math.round(n))); return `<span class="dots" aria-label="${k} out of 5">${'●'.repeat(k)}<i>${'●'.repeat(5 - k)}</i></span>`; };
function gradeHTML(h) {

  const bars = Object.entries(DIM).map(([k, lab]) => { const v = p[k]; return `<div class="bar-row ${v == null ? 'unknown' : ''}"><span>${lab}</span><span class="tr"><i style="width:${v ?? 0}%;background:${scoreColor(v)}"></i></span><b>${v == null ? '?' : Math.round(v)}</b></div>`; }).join('');
  const g = [['Interior', r.interior], ['Kitchen', r.kitchen], ['Building luxury', r.building_luxury], ['Natural light', r.natural_light], ['View', r.view]].filter(([, v]) => v != null);

function openQuestions(h) {
  const q = [], gates = (sc(h).gates || []).map(gateText).filter(([, k]) => k !== 'bad' || true);
  for (const [t] of gates) q.push(t + ': confirm with the leasing office');

// ------------------------------------------------------------------ reasons
const reasonsHTML = (h, n = 4) => {
  const R = (h.reasons || []).slice(0, n);

};

// ------------------------------------------------------------------ map
function mapHTML() {
  const hs = D.homes.filter((h) => h.lat != null && h.lon != null), pts = [...hs, ...(dest ? [dest] : [])];
  if (!pts.length) return '';
  const la = pts.map((p) => p.lat), lo = pts.map((p) => p.lon), midLat = (Math.min(...la) + Math.max(...la)) / 2, kx = Math.cos((midLat * Math.PI) / 180);
  let x0 = Math.min(...lo) * kx, x1 = Math.max(...lo) * kx, y0 = Math.min(...la), y1 = Math.max(...la);
  const pad = Math.max(x1 - x0, y1 - y0, 0.006) * 0.2; x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
  const W = 640, H = 440, k = Math.min(W / (x1 - x0), H / (y1 - y0)), ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const P = (lat, lon) => [ox + (lon * kx - x0) * k, H - oy - (lat - y0) * k];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the shortlist: ${hs.map((h, i) => `${i + 1}, ${esc(name(h))}`).join('; ')}"><rect class="bg" width="${W}" height="${H}"/>`;
  for (const ln of D.map?.lines || []) {
    const d = (ln.d || []).map((run) => run.map(([lon, lat], i) => { const [x, y] = P(lat, lon); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join('')).join('');
    if (d) s += `<path class="tl" d="${d}" stroke="${esc(/^#[0-9a-f]{3,8}$/i.test(ln.c || '') ? ln.c : 'var(--ink4)')}"/>`;
  }
  if (dest) { const [x, y] = P(dest.lat, dest.lon); s += `<g class="dest"><rect x="${x - 8}" y="${y - 8}" width="16" height="16" rx="4"/><text x="${x}" y="${y - 14}">${esc(dest.name)}</text></g>`; }
  hs.forEach((h) => { const [x, y] = P(h.lat, h.lon), n = D.homes.indexOf(h) + 1; s += `<g class="pin ${h.pick?.tier === 'S' ? 't1' : ''}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}">${n}</text><title>${n}. ${esc(name(h))}</title></g>`; });
  return s + `</svg><span class="cap">${(D.map?.lines || []).length ? 'Subway lines in agency colours · ' : ''}north up · schematic, not street detail</span>`;
}

// ------------------------------------------------------------------ the shortlist layout

function memoHome(h, i) {

}

}
render();
const start = /^#memo/.test(location.hash) ? 'memo' : D.view === 'memo' ? 'memo' : 'cards';
setView(start, false);
const saved = (() => { try { return localStorage.getItem('as-share-theme'); } catch { return null; } })();
if (saved === 'light' || saved === 'dark') root.dataset.theme = saved; else if (matchMedia('(prefers-color-scheme: light)').matches) root.dataset.theme = 'light';
document.querySelectorAll('.seg [data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('print').addEventListener('click', () => window.print());
document.getElementById('theme').addEventListener('click', () => { const next = root.dataset.theme === 'light' ? 'dark' : 'light'; root.dataset.theme = next; try { localStorage.setItem('as-share-theme', next); } catch { /* ignore */ } });
app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-img]'); if (t) { const card = t.closest('.home'), i = +t.dataset.img, P = photos(D.homes[+card.dataset.i]); const m = card.querySelector('.main'); if (P[i]) { m.querySelector('img')?.remove(); m.classList.remove('broken'); m.insertAdjacentHTML('afterbegin', photoTag(P[i], `${name(D.homes[+card.dataset.i])}, photo ${i + 1} of ${P.length}`, false)); const cr = m.querySelector('.credit'); if (cr) cr.textContent = P[i].credit || ''; card.querySelectorAll('[data-img]').forEach((b) => b.toggleAttribute('aria-current', b === t)); } }
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); document.getElementById('h' + j.dataset.jump)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }
});
if (/^#memo-print/.test(location.hash)) { setView('memo', false); setTimeout(() => window.print(), 400); }
})();
</script>
