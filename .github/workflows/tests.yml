name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          APARTMENTSCOUT_E2E: "0"   # the browser suite runs in its own job below
      - run: python scripts/release_check.py --skip-tests --only privacy,ignored,photos
      - run: python scripts/make_media_lite.py examples/nyc-2026 --check   # the starter photos still match what listings.json calls for
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js
  e2e:
    # every dashboard view in dark and light at 1440 and 390 px, key interactions and axe-core, in headless Chromium
    # (SwiftShader WebGL; checks that need WebGL skip themselves if it is missing). Tiles and photos are blocked.
    # Software GL makes opening the map, Unit 3D and the floor plan studio block the page for seconds, so tests wait for
    # each heavy view to go idle before the next action (see SETTLED_JS in tests/e2e/test_dashboard.py) instead of
    # leaning on long timeouts. Reproduce a slow runner locally with APARTMENTSCOUT_E2E_CPU_THROTTLE=6.
    # Split across parallel runners by file so each shard stays well inside the timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: views
            files: tests/e2e/test_dashboard.py
          - name: decide-and-shell
            files: tests/e2e/test_decision.py tests/e2e/test_shell_extras.py tests/e2e/test_tour_findings.py tests/e2e/test_office_questions.py tests/e2e/test_tourday.py tests/e2e/test_moves_unknowns.py
          - name: lighting
            files: tests/e2e/test_lighting.py
          - name: map-media-results
            files: tests/e2e/test_map_features.py tests/e2e/test_lightbox.py tests/e2e/test_media_tiers.py tests/e2e/test_results_rail.py tests/e2e/test_pdf_tracer.py tests/e2e/test_plan_upload.py
          - name: wizard
            files: tests/e2e/test_wizard.py tests/e2e/test_onboarding.py tests/e2e/test_boot_recovery.py tests/e2e/test_menu_nav.py
          - name: model-project
            files: tests/e2e/test_model_project.py tests/e2e/test_furniture_studio.py
          - name: interior-views
            files: tests/e2e/test_interior_view.py tests/e2e/test_eye_level_look.py tests/e2e/test_finishes_render.py
          - name: city-context
            files: tests/e2e/test_context3d.py
          - name: buildings-3d
            files: tests/e2e/test_buildings3d.py
          - name: one-city
            files: tests/e2e/test_one_city.py tests/e2e/test_daycycle.py
          - name: places-destinations
            files: tests/e2e/test_places_multidest.py tests/e2e/test_map_clusters.py
          - name: pwa-landing
            files: tests/e2e/test_pwa.py tests/e2e/test_landing_page.py
    name: e2e (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4   # the pwa-landing shard builds the optimised site with esbuild (npx)
        if: matrix.shard.name == 'pwa-landing'
        with:
          node-version: "22"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e ${{ matrix.shard.files }} -q -rs --durations=10   # the slowest tests show where a runner struggles
        env:
          APARTMENTSCOUT_E2E: "1"
      - name: every e2e file belongs to a shard
        if: matrix.shard.name == 'views'
        run: |
          for f in tests/e2e/test_*.py; do
            grep -q "$f" .github/workflows/tests.yml || { echo "$f is not in any e2e shard"; exit 1; }
          done
  perf:
    # first-load budget of the published site and of the standalone file: bundle, data and CSS sizes (gzip, what Pages sends),
    # request count, LCP and TBT in Chromium. Limits live in scripts/perf_budget.json; `python scripts/perf_check.py --help`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: "Build the published site (no photos: the check serves them from the example folder)"
        run: NO_MEDIA=1 scripts/build_site.sh _site
      - name: Build the standalone file
        run: apartmentscout build --search examples/nyc-2026 --out /tmp/as-data --standalone /tmp/as-standalone.html
      - name: First-load budget
        run: python scripts/perf_check.py --site _site --standalone /tmp/as-standalone.html --check --runs 3 --cpu 1 --net broadband --json perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: perf.json
