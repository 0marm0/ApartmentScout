name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          APARTMENTSCOUT_E2E: "0"   # the browser suite runs in its own job below
      - run: python scripts/release_check.py --skip-tests --only privacy,ignored,photos
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js
  e2e:
    # every dashboard view in dark and light at 1440 and 390 px, key interactions and axe-core, in headless Chromium
    # (SwiftShader WebGL; checks that need WebGL skip themselves if it is missing). Tiles and photos are blocked.
    # Software GL makes opening the map, Unit 3D and the floor plan studio block the page for seconds, so tests wait for
    # each heavy view to go idle before the next action (see SETTLED_JS in tests/e2e/test_dashboard.py) instead of
    # leaning on long timeouts. Reproduce a slow runner locally with APARTMENTSCOUT_E2E_CPU_THROTTLE=6.
    # Split across parallel runners by file so each shard stays well inside the timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: views
            files: tests/e2e/test_dashboard.py
          - name: decide-and-shell
            files: tests/e2e/test_decision.py tests/e2e/test_shell_extras.py tests/e2e/test_tour_findings.py
          - name: lighting
            files: tests/e2e/test_lighting.py
          - name: map-media-results
            files: tests/e2e/test_map_features.py tests/e2e/test_lightbox.py tests/e2e/test_results_rail.py tests/e2e/test_pdf_tracer.py
          - name: wizard
            files: tests/e2e/test_wizard.py
          - name: model-project
            files: tests/e2e/test_model_project.py
          - name: places-destinations
            files: tests/e2e/test_places_multidest.py
    name: e2e (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e ${{ matrix.shard.files }} -q -rs --durations=10   # the slowest tests show where a runner struggles
        env:
          APARTMENTSCOUT_E2E: "1"
      - name: every e2e file belongs to a shard
        if: matrix.shard.name == 'views'
        run: |
          for f in tests/e2e/test_*.py; do
            grep -q "$f" .github/workflows/tests.yml || { echo "$f is not in any e2e shard"; exit 1; }
          done
