name: Landing page and dashboard demo on GitHub Pages
# Published layout (scripts/build_site.sh does the assembly; landing/README.md has the table):
#   /            landing/ (index.html, landing.css, landing.js)
#   /tokens.css  dashboard/css/tokens.css (shared design tokens)
#   /images/     the screenshots the landing page uses, as WebP (scripts/landing_images.py)
#   /assets/     dashboard/assets/ (brand icon, favicon)
#   /fonts/      dashboard/vendor/fonts/ (self-hosted Geist, no Google Fonts)
#   /demo/       dashboard/ with its example data, bundled and split by scripts/optimize_site.py, installable and offline-capable
#   /demo/media/ the example's full photo set, from the GitHub release (scripts/fetch_media.sh): the public photo host that
#                search.media_base_url points at, so clones and the standalone file fetch the photos they lack from here
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow   # the landing screenshots are converted to WebP at build time
      - name: Fetch the example photos from their release (they are not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_media.sh
      - name: Assemble the site (copy, then bundle, split and make the dashboard installable)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          scripts/build_site.sh _site
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
