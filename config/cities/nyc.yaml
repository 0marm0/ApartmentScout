# City profile: New York City. Used when criteria.yaml has `search.city: nyc`.
name: New York City
timezone: America/New_York
geocoder: nyc                     # NYC Planning Labs GeoSearch (returns BBL/BIN)
buildings: nyc                    # NYC Building Footprints with roof heights
records: nyc                      # HPD, DOB, ECB, 311, NYPD, PLUTO, bedbugs
layers: [noise]                   # citywide 311 noise heat layer
# MTA static GTFS (developer data page: https://new.mta.info/developers). Each feed's mode comes from
# its route_type, or set `mode: subway | bus | rail | ferry`. Buses are routed (bus-only and subway+bus
# times) but not drawn on the map. Only the time window before arrive_by and stops near the search are
# loaded, so the bus feeds add a few seconds, not minutes.
transit_feeds:
  - name: NYC Subway
    url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
    mode: subway
  - name: NYC Bus Manhattan
    url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_m.zip
    mode: bus
  - name: MTA Bus Company
    url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_busco.zip
    mode: bus
    exclude_routes: ["^(BxM|BM|QM|SIM|X)[0-9]"]   # premium-fare express buses; drop this line to include them
  # Other boroughs' local buses, if the search reaches them:
  # - {name: NYC Bus Brooklyn, url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_b.zip, mode: bus}
  # - {name: NYC Bus Bronx, url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_bx.zip, mode: bus}
  # - {name: NYC Bus Queens, url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_q.zip, mode: bus}
  # - {name: PATH, url: http://data.trilliumtransit.com/gtfs/path-nj-us/path-nj-us.zip, mode: rail}
# Walking: `network` walks the OpenStreetMap pedestrian network (sidewalks, crossings, park paths, bridge
# walkways; no motorways or road tunnels) to the station's real entrances; `grid` uses the street-grid
# metric below. The grid metric is also the fallback when the network cannot be fetched.
walk_model: network
# Subway entrances: MTA "Subway Entrances and Exits: 2024" (data.ny.gov i9wp-a4ja), matched to GTFS stations.
station_entrances: nyc
# Walking on the street grid (walk_model: grid, or the fallback): inside the polygon, walking metres = factor x (blend x L1 + (1 - blend) x
# straight line), with L1 measured along the avenues (bearing_deg east of north) and the streets.
# Fitted on 208 Manhattan walks (walk MAE 0.6 min against 3.9 for straight x 1.25). Outside the polygon,
# or between Manhattan and anywhere else, walking is straight line x walk_detour.
walk_grids:
  - name: Manhattan
    bearing_deg: 29
    factor: 1.01
    blend: 0.9
    polygon:   # [lon, lat], along the Hudson shore north, then down the Harlem and East River shores
