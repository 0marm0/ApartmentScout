# City profile: New York City. Used when criteria.yaml has `search.city: nyc`.
name: New York City
timezone: America/New_York
geocoder: nyc                     # NYC Planning Labs GeoSearch (returns BBL/BIN)
buildings: nyc                    # NYC Building Footprints with roof heights
records: nyc                      # HPD, DOB, ECB, 311, NYPD, PLUTO, bedbugs
layers: [noise]                   # citywide 311 noise heat layer
transit_feeds:
  - name: NYC Subway
    url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
  # Add buses or PATH if your commute needs them (large feeds, slower):
  # - name: Manhattan buses
  #   url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_m.zip
  # - name: PATH
  #   url: http://data.trilliumtransit.com/gtfs/path-nj-us/path-nj-us.zip
listing_sites: [StreetEasy, Zillow, Apartments.com, RentHop, Corcoran, Compass, building websites]
review_sites: [Openigloo, Google Maps, Yelp, Reddit r/AskNYC, r/NYCapartments, ApartmentRatings, Birdeye]
# Names for the tallest towers so the 3D view labels them. Matched within 120 m.
