# ApartmentScout criteria. Copy into your search folder with `apartmentscout init`.
# Every field is optional except search.name; leave out what you do not care about.

search:
  name: My apartment search
  city: generic              # nyc switches on NYC Open Data (records, footprints, 311 noise layer)
  timezone: America/New_York # IANA zone for sun times
  move_in:
    earliest: 2026-11-01
    latest: 2026-12-01
  map_center: [40.7549, -73.9840]   # lat, lon the map opens on
  map_zoom: 13
  # default_listing: building-1211   # optional: the home Unit 3D and the Floor plan studio open first (a listing id); without it, the first in their lists
  # tiles: https://tile.openstreetmap.org/{z}/{x}/{y}.png   # optional custom basemap
  # tiles_attribution: © OpenStreetMap contributors

budget:
  basis: monthly_cost        # net-effective rent + recurring fees + one-time fees / lease months
  tiers:                     # labels shown on the map and in reports, cheapest first
    - {name: Target,  max: 3000}
    - {name: Stretch, max: 3300}
  hard_max: 3500             # above this a listing fails the budget gate

unit:
  min_beds: 1
  sqft_floor: 450            # this size scores 0
  sqft_good: 700             # 50
  sqft_great: 1000           # 100

# Amenity keys: in_unit_wd, elevator, doorman, gym, pool, roof_deck, outdoor_space, dishwasher,
# central_ac, pets, parking, bike_room, package_room, lounge, coworking, game_room (or your own).
must_have: [in_unit_wd]
strongly_prefer: [dishwasher, elevator]
nice_to_have: [gym, roof_deck, outdoor_space]

commute:
  destinations:
    - name: Work
      address: 1 Main St, Anytown
      # lat/lon are filled by `apartmentscout geocode`; paste them here
      arrive_by: "09:00"
      max_minutes: 35
      weight: 1.0
  transit:
    feeds: []                # add GTFS feeds: - {name: City Metro, url: https://.../gtfs.zip}
    service_date: 2026-11-04 # a normal weekday inside the feed's calendar
    # each feed may set mode: subway | bus | rail | ferry (else its route_type decides) and
    # exclude_routes: [regex, ...] to drop routes by short name (e.g. premium express buses)
    walk_speed_kmh: 4.8
    walk_detour: 1.25            # street distance / straight-line distance (outside any walk grid)
    # How walking is measured. Each is optional; the city profile (config/cities/<city>.yaml) sets the default.
    # walk_model: network        # network = walk the OpenStreetMap pedestrian network (sidewalks, crossings, park
    #                            # paths) to the station's real entrances; slower (NYC example: ~26 s a run),
    #                            # fetched once into cache/walk/. grid = the street-grid metric / walk_detour
    #                            # above (~5 s), also the fallback when the network cannot be fetched.
    # station_entrances: osm     # where you step into a station (network model only): nyc = the MTA's published
    #                            # entrances and exits; osm = OpenStreetMap subway/train entrance nodes (any
    #                            # city); or a list of {station: <GTFS stop id>, lat, lon, entry: true, exit: true};
    #                            # omit it to use each stop's own coordinates.
    # walk_snap_m: 60            # network model: a point (or heat-map cell) farther than this many metres from a
    #                            # walkable way is left blank on the heat map; a listing takes the fastest of
    #                            # every way within this distance, so the map and the listing agree.
    # walk_grids: false          # turn off the city profile's street-grid walking (or give your own list:
    #                            # [{name, bearing_deg, factor, blend, polygon: [[lon, lat], ...]}])
    station_access_min: 2        # street to subway platform (bus 0.5, rail and ferry 3: set access_min per mode)
    # access_min: {subway: 2, bus: 0.5, rail: 3, ferry: 3}
    egress_access: 1             # charge that access time again at the destination end (0 = never)
    max_walk_to_station_m: 1200
    arrival_offsets_min: [0, 3, 6, 9, 12]   # arrive this much before arrive_by; times are averaged
    mode_grids: true             # also write one heat grid per mode (commute-<dest>-subway.json, -bus.json)
  # Commute by time of day. `apartmentscout commute` also routes midday, the evening way home, late evening and a
  # Saturday morning, so the dashboard can show "18 min at 9:00, 24 min leaving at 18:00, 37 min leaving at 22:00".
  # On by default; nothing below changes the score unless you set `score`.
  # times:
  #   enabled: true              # false = the arrive_by trip only
  #   score: am                  # which trip the commute SCORE reads: am (arrive_by, the default), a slot id, or weighted
  #   weights: {am: 3, pm: 3, mid: 1, late: 1, wknd: 1}    # for score: weighted
  #   slots:                     # replaces the default list; kind arrive = from home, arriving by `time`; depart = from the destination, back home
  #     - {id: am,   label: Morning peak,       kind: arrive, time: null}     # null = the destination's arrive_by
  #     - {id: mid,  label: Midday,             kind: arrive, time: "13:00"}
  #     - {id: pm,   label: Evening peak, home, kind: depart, time: "18:00"}
  #     - {id: late, label: Late evening, home, kind: depart, time: "22:00"}
  #     - {id: wknd, label: Weekend,            kind: arrive, time: "11:00", day: saturday}

# Scoring recipe. Presets (named, versioned weight sets): balanced, biggest-and-nicest,
# cheapest-good-enough, shortest-commute, or your own under `presets:`. `weights:` below then adjusts
# the preset key by key; delete it to use the preset as is.
scoring:
  preset: balanced
  stale_days: 21             # listings checked longer ago than this get a "stale" gate (never a lower score)
  # as_of: 2026-11-01        # score against this date instead of today (move date, stale checks, offers)
  # presets:
  #   my-mix: {cost: 30, space: 30, commute: 20, amenities: 10, light_view: 10, move_date: 5}

weights:                     # relative; only the ratios matter
  cost: 25
  space: 20
  commute: 20
  amenities: 15
  light_view: 10
  building: 5
  quiet: 5
  move_date: 0               # newer dimensions, off unless you weight them
  renewal_risk: 0
  transit_access: 0

favorites_first: true
# landmarks: [[Name, lat, lon], ...]   # optional names for towers in the 3D view
