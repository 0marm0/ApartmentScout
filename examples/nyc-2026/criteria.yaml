# ApartmentScout criteria: the sample search (Manhattan 1BR, fall 2026).
# Copy config/criteria.example.yaml to start your own.

search:
  name: Manhattan 1BR, fall 2026
  city: nyc                 # enables the NYC Open Data modules (311, HPD, DOB, PLUTO, footprints)
  move_in:
    earliest: 2026-10-15
    latest: 2026-11-01
  map_center: [40.7530, -73.9790]
  map_zoom: 13
  # Where the full set of listing photos is published (the demo site serves the GitHub release's photos here). A photo that is in
  # neither media/ nor media-lite/ next to this file is fetched from <this folder>/<its path under media/>. A fork changes this to its own site.
  media_base_url: https://0marm0.github.io/ApartmentScout/demo/media/

budget:
  basis: monthly_cost       # net-effective rent + recurring fees + one-time fees spread over the lease
  tiers:
    - {name: Target,          max: 5000}
    - {name: Stretch,         max: 5200}
    - {name: Slightly over,   max: 5450}
  hard_max: 5450            # anything above is marked over budget

unit:
  min_beds: 1
  sqft_floor: 450           # scores 0 at or below
  sqft_good: 750            # scores 50
  sqft_great: 1050          # scores 100

must_have: [in_unit_wd, elevator]
strongly_prefer: [doorman, gym]
nice_to_have: [roof_deck, pool, lounge, game_room, dishwasher]

commute:
  destinations:
    - name: Grand Central
      address: Grand Central Terminal, 89 E 42nd St, New York, NY
      lat: 40.752726
      lon: -73.977229
      arrive_by: "09:00"
      max_minutes: 30
      weight: 1.0
  transit:
    feeds:
      - name: NYC Subway
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
        mode: subway
      - name: NYC Bus Manhattan
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_m.zip
        mode: bus
      - name: MTA Bus Company
        url: https://rrgtfsfeeds.s3.amazonaws.com/gtfs_busco.zip
        mode: bus
        exclude_routes: ["^(BxM|BM|QM|SIM|X)[0-9]"]   # premium-fare express buses
    walk_speed_kmh: 4.8
    max_walk_to_station_m: 1200
    service_date: 2026-10-14   # a normal weekday inside the feed's calendar

# Scoring recipe: a named preset (balanced, biggest-and-nicest, cheapest-good-enough,
# shortest-commute), adjusted key by key by `weights:` below.
scoring:
  preset: balanced
  stale_days: 21            # re-check listings older than this; the gate never lowers the score

# Relative weights. They are normalised, so only the ratios matter.
weights:
  cost: 20
  space: 15
  commute: 10
  amenities: 5
  light_view: 15            # sun model plus the view and light the unit's own photos show
  building: 15              # your building ratings, then quality (age, height, service, amenities, stars), then records
  interior: 15              # finishes, renovation and appliances from the unit's photos or wording
  quiet: 5
  move_date: 0              # fit with the move-in window (0 = shown, not ranked)
  renewal_risk: 0           # renewal shock after a deep first-lease concession
  transit_access: 0         # lines within a 10-minute walk, one-seat ride

# Optional: hand-set favourites always float to the top of the shortlist view.
favorites_first: true

# Your own 1-5 rating of buildings you know (5 = love it, 1 = avoid). It leads the building score.
# Matched by building name; add buildings as you tour them.
building_ratings:
  Paramount Tower: 5
  The Knox: 5
  Emerald Green: 5
  The Corinthian: 5
  Orion Condominium: 5
  Mercedes House: 5
  The Horizon: 2
